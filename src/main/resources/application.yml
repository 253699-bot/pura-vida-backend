server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: pura-vida-api
  datasource:
    url: ${PURAVIDA_DB_URL:jdbc:mysql://localhost:3306/pura_vida?createDatabaseIfNotExist=false&useSSL=false&serverTimezone=UTC}
    username: ${PURAVIDA_DB_USERNAME:puravida_app}
    password: ${PURAVIDA_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: 0
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
        temp:
          use_jdbc_metadata_defaults: false
  sql:
    init:
      mode: never

security:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-this-secret-please-32-chars-minimum}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
