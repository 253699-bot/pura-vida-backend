name: Deploy Backend to AWS EC2

on:
  workflow_dispatch:
  # Para habilitar despliegues automáticos después de validarlo manualmente:
  # push:
  #   branches:
  #     - dev/aiko

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy backend JAR
    runs-on: ubuntu-latest
    env:
      JAR_NAME: pura-vida-backend.jar
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_PORT: ${{ secrets.EC2_PORT }}
      EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: mvn clean test

      - name: Build executable JAR
        run: mvn clean package -DskipTests

      - name: Select deployment JAR
        shell: bash
        run: |
          set -euo pipefail
          jar_path=""
          while IFS= read -r -d '' candidate; do
            [[ "$candidate" == *-plain.jar ]] && continue
            jar_path="$candidate"
            break
          done < <(find target -maxdepth 1 -type f -name '*.jar' -print0)
          [[ -n "$jar_path" ]] || {
            echo "No se encontró un JAR ejecutable en target/."
            exit 1
          }
          cp "$jar_path" "$JAR_NAME"

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${EC2_HOST:?Configura el secret EC2_HOST.}"
          : "${EC2_USER:?Configura el secret EC2_USER.}"
          : "${EC2_SSH_KEY:?Configura el secret EC2_SSH_KEY.}"
          : "${EC2_APP_DIR:?Configura el secret EC2_APP_DIR.}"
          EC2_PORT="${EC2_PORT:-22}"
          case "$EC2_PORT" in
            *[!0-9]* | "")
              echo "EC2_PORT debe ser un puerto numérico."
              exit 1
              ;;
          esac
          echo "Configuración de despliegue validada."

      - name: Prepare temporary SSH key
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/puravida-ec2"
          chmod 600 "$HOME/.ssh/puravida-ec2"
          ssh-keyscan -p "${EC2_PORT:-22}" -H "$EC2_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload JAR to EC2
        shell: bash
        run: |
          set -euo pipefail
          scp \
            -i "$HOME/.ssh/puravida-ec2" \
            -P "${EC2_PORT:-22}" \
            -o StrictHostKeyChecking=yes \
            "$JAR_NAME" \
            "$EC2_USER@$EC2_HOST:/tmp/$JAR_NAME"

      - name: Install JAR and restart systemd service
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/puravida-ec2" \
            -p "${EC2_PORT:-22}" \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "sudo -n install -d -o puravida -g puravida -m 0755 '$EC2_APP_DIR' && \
             sudo -n install -o puravida -g puravida -m 0644 '/tmp/$JAR_NAME' '$EC2_APP_DIR/$JAR_NAME' && \
             sudo -n rm -f '/tmp/$JAR_NAME' && \
             sudo -n systemctl daemon-reload && \
             sudo -n systemctl restart puravida-api && \
             sudo -n systemctl status puravida-api --no-pager"

      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/puravida-ec2" "$HOME/.ssh/known_hosts"
